# HTTP — keep ACME renewal working, redirect everything else to HTTPS
server {
    listen 80;
    server_name 13.204.223.249;
    root /usr/share/nginx/html;
    client_max_body_size 60m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name 13.204.223.249;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 60m;

    ssl_certificate /etc/letsencrypt/live/13.204.223.249/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13.204.223.249/privkey.pem;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
